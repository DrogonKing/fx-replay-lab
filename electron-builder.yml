# Packaging configuration.
#
# Targets: Windows installer + portable, macOS dmg, Linux AppImage + deb.
# The app is fully offline, so nothing extra is bundled beyond the built code.
appId: site.drogon.fxreplaylab
productName: FX Replay Lab
copyright: FX Replay Lab

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - package.json
  - "!**/*.map"
  - "!**/node_modules/**/{test,__tests__,tests,example,examples}/**"

# better-sqlite3 ships a prebuilt .node; keep it unpacked so Electron can load it
asarUnpack:
  - "**/node_modules/better-sqlite3/**"

# The MetaTrader bridge and its Python runtime ship inside the installer, so the user installs
# nothing extra: they type account, password and server, and press Connect. The app spawns the
# interpreter itself. Windows-only in practice - MetaTrader5 publishes no other wheels - so other
# platforms get the files but the panel reports the bridge as unavailable with the reason.
extraResources:
  - from: bridge
    to: bridge
    filter:
      - "**/*"
      - "!python/**/__pycache__/**"
      - "!**/*.pyc"

win:
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
  artifactName: "${productName}-${version}-${arch}.${ext}"

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: FX Replay Lab

# Windows only.
#
# Not a packaging preference: the in-app MetaTrader bridge depends on the MetaTrader5 package, which
# publishes win_amd64 wheels and nothing else. A macOS or Linux build would install fine and then
# show a permanently disabled Connect button, which is worse than not offering the build at all.
#
# Two artefacts: the NSIS installer (normal case) and a portable zip (no admin rights, runs from a
# folder). Both are verified by scripts/release-smoke.sh.

# No auto-update: the app is offline by design.
publish: null
