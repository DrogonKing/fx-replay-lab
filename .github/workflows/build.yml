# Build, test and package FX Replay Lab.
#
# Produces three things per run:
#   1. a failing job if tests or typecheck fail (nothing ships on red);
#   2. Windows/macOS/Linux installers plus a portable Windows zip;
#   3. downloadable artefacts attached to a release on tag pushes.
#
# The app is offline by design, so the build deliberately does NOT fetch anything
# at runtime; only npm install touches the network, at build time.

name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  NODE_VERSION: "22"

jobs:
  verify:
    name: test + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: install
        run: npm ci

      - name: typecheck (strict)
        run: npx tsc --noEmit -p tsconfig.json

      - name: unit tests
        run: npx vitest run --reporter=verbose

      - name: build renderer + main
        run: npm run build

      - name: verify the bundle is offline-clean
        run: node scripts/verify-offline.mjs

  package:
    name: package ${{ matrix.os }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: install
        run: npm ci

      - name: rebuild native modules against Electron
        run: npx electron-rebuild -f -w better-sqlite3

      - name: build
        run: npm run build

      # The bridge runtime is gitignored (64MB of vendored interpreter), so it is fetched here.
      # Without this the installer would silently ship without the bridge and Connect would fail on
      # the user's machine, long after a green build.
      - name: fetch the bundled Python runtime for the MetaTrader bridge
        run: node scripts/fetch-python-runtime.mjs

      - name: verify the runtime is present for packaging
        run: |
          test -f bridge/python/python.exe || { echo "no python.exe"; exit 1; }
          test -f bridge/python/Lib/site-packages/MetaTrader5/__init__.py || { echo "no MetaTrader5"; exit 1; }
          test -f bridge/python/Lib/site-packages/numpy/__init__.py || { echo "no numpy"; exit 1; }

      # better-sqlite3 is a native addon; electron-builder must not try to
      # rebuild it again with a mismatched toolchain on CI.
      - name: package (${{ matrix.target }})
        run: npx electron-builder --${{ matrix.target }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # unsigned builds: signing needs secrets this repo does not require
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: fx-replay-lab-${{ matrix.target }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/*.zip
          if-no-files-found: warn
          retention-days: 30

  release:
    name: attach to release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefacts
      - name: publish
        uses: softprops/action-gh-release@v2
        with:
          files: artefacts/**/*
          generate_release_notes: true
